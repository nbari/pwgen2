[package]
name = "pwgen2"
version = "0.8.0"
edition = "2024"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "password generator"
documentation = "https://docs.rs/pwgen2/latest/pwgen2/"
homepage = "https://github.com/nbari/pwgen2/"
repository = "https://github.com/nbari/pwgen2/"
readme = "README.md"
keywords = ["password", "generator", "hash", "security"]
categories = ["command-line-utilities", "command-line-interface"]
license = "BSD-3-Clause"

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
anyhow = "1"
bip39 = { version = "2.2", features = ["rand"] }
clap = "4.6"
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bcrypt = "0.19"
pbkdf2 = { version = "0.12", features = ["password-hash", "simple", "std"] }
sha-crypt = { version = "0.5", features = ["simple"] }
serde_json = "1.0"
crossbeam = "0.8"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pwgen2", dest = "/usr/bin/pwgen2", mode = "0755" },
]
